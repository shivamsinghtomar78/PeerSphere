version: '3.9'

services:
  # ── PostgreSQL ────────────────────────────────────────────────────
  # Development database for the unified PeerSphere Next.js app.
  # The app runs locally (npm run dev) and connects via DATABASE_URL.
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: peersphere
      POSTGRES_PASSWORD: peersphere
      POSTGRES_DB: peersphere_dev
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U peersphere']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: